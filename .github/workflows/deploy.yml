# Builds the site and publishes it to GitHub Pages on every push to main.
# On pull requests it only builds and checks (nothing is published).
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the CV page shows the date of the PDF's last commit.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Only used when a PDF has no committed images yet (for example one
      # uploaded through the GitHub web page).
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - run: npm ci

      - name: Build and check
        run: npm run build
        env:
          # Set the repository variable SITE_URL when you move to a custom domain.
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Check internal links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --offline --root-dir ${{ github.workspace }}/dist dist
          fail: true

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
