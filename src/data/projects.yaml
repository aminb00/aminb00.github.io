- id: rpca
  title: Adaptive Fault Detection under Process Drift using Recursive PCA
  context:
    - Course project, Adaptive Learning, Estimation and Supervision of Dynamical Systems
    - University of Bergamo
    - "2026"
    - MATLAB
  summary: Built a real-time fault diagnosis system (Recursive PCA, Li et al. 2000) for predictive maintenance of non-stationary industrial processes, telling genuine sensor faults apart from benign process drift that defeats fixed-model PCA.
  summaryVerbatim: true
  # Numbers from the conclusion slide of the deck (slide 46).
  result: "false-alarm rate reduced from `44.6%` to `10.2%` with block-wise RPCA (`B = 10`, `λ = 0.995`); detection rate `95%` for impulsive, `73%` for incipient and `42%` for step faults, on a synthetic multi-sensor dataset with simultaneous drifts and impulsive, incipient and step faults."
  method: "adaptive RPCA with EWMA covariance tracking and incremental eigenstructure updates (Lanczos tridiagonalization, Sturm-sequence bisection, inverse iteration), avoiding full SVD, with VRE-based component selection."
  tags: [control, ml]
  material:
    - type: code
      url: https://github.com/aminb00/Adaptive-Fault-Detection-under-Process-Drift-using-Recursive-PCA
    - type: pdf
      id: rpca-livescript-rpca
      label: "`RPCA` live script"
      file: rpca-livescript-rpca.pdf
      source: { github: { repo: aminb00/Adaptive-Fault-Detection-under-Process-Drift-using-Recursive-PCA, path: "LIVESCRIPTS-HTML&PDF/RPCA.pdf" } }
    - type: pdf
      id: rpca-livescript-pca-batch
      label: "`PCA_batch` live script"
      file: rpca-livescript-pca-batch.pdf
      source: { github: { repo: aminb00/Adaptive-Fault-Detection-under-Process-Drift-using-Recursive-PCA, path: "LIVESCRIPTS-HTML&PDF/PCA_batch.pdf" } }
    - type: pdf
      id: rpca-livescript-data-preparation
      label: "`DataPreparation` live script"
      file: rpca-livescript-data-preparation.pdf
      source: { github: { repo: aminb00/Adaptive-Fault-Detection-under-Process-Drift-using-Recursive-PCA, path: "LIVESCRIPTS-HTML&PDF/DataPreparation.pdf" } }
  oneLine: "**Adaptive Fault Detection under Process Drift using Recursive PCA**, course project, University of Bergamo, 2026: false-alarm rate reduced from `44.6%` to `10.2%`."

- id: rag
  title: RAG System for University Knowledge Access
  context:
    - Team course project, Information Retrieval
    - Universiteit Antwerpen
    - "2025"
    - Python
  summary: "Team project building a RAG system that answers questions about the UAntwerp Master's program, retrieving relevant passages and generating answers with GPT-4o."
  summaryVerbatim: true
  result: "Recall@5 `0.80 ± 0.28` and MRR `1.00` on a hand-labelled set (`n = 19`); optional agentic workflow `0.73 ± 0.30`; LLM-as-judge for faithfulness and relevance."
  method:
    - "Data: 588 passages from course and program pages."
    - "Chunking: about 250 tokens with 15% overlap, cut at sentence and section boundaries."
    - "Embeddings: all-MiniLM-L6-v2 (384-dim, local); all-mpnet-base-v2 and bge-small-en-v1.5 also tested."
    - "Index: FAISS IndexFlatIP (cosine on L2-normalized vectors)."
    - "Retrieval: top-5 with 3×k candidate expansion, rerank, and a boost on course code and section."
    - "Generation: GPT-4o (temperature 0.1, prompt restricted to the retrieved context)."
    - "Optional LangGraph workflow: query tagging, multi-query expansion, RRF fusion, MMR diversification."
    - Error analysis on retrieval failures and hallucinations.
  tags: [ir]
  material:
    - type: code
      label: code (my fork of the team repo)
      url: https://github.com/aminb00/RAG-System-for-University-Knowledge-Access
    - type: pdf
      id: rag-report
      label: report
      file: rag-report.pdf
      poster: true
      source: { github: { repo: aminb00/RAG-System-for-University-Knowledge-Access, path: report.pdf } }
    - type: link
      label: REPORT.md
      url: https://github.com/aminb00/RAG-System-for-University-Knowledge-Access/blob/main/REPORT.md
    - type: todo
      note: slides, if any

